<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🎬 YouTube AI Chatbot</h1>
      <p class="subtitle">Chat with any YouTube video using AI</p>
    </div>

    <!-- Video Loading Section -->
    <div class="video-section">
      <div class="video-input-group">
        <input 
          id="videoUrl" 
          type="text" 
          placeholder="Paste YouTube URL here..." 
          class="video-input"
        />
        <button id="loadBtn" class="load-btn">
          <span class="btn-text">Load Video</span>
          <span class="btn-loader" style="display: none;">⏳</span>
        </button>
      </div>
      <div id="loadStatus" class="load-status"></div>
      
      <!-- Video Info (appears after loading) -->
      <div id="videoInfo" class="video-info" style="display: none;">
        <div class="video-badge">✅ Video Loaded</div>
        <div id="videoId" class="video-id"></div>
      </div>
    </div>

    <!-- Chat Interface -->
    <div class="chat-container">
      <!-- Chat Messages Area -->
      <div id="chatMessages" class="chat-messages">
        <div class="welcome-message">
          <div class="welcome-icon">👋</div>
          <h3>Welcome to YouTube AI Chat!</h3>
          <p>Load a YouTube video above, then start asking questions about it.</p>
          <div class="example-questions">
            <p><strong>Try asking:</strong></p>
            <ul>
              <li>"What is this video about?"</li>
              <li>"Summarize the main points"</li>
              <li>"What did they say about [topic]?"</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Chat Input Area -->
      <div class="chat-input-container">
        <div class="chat-input-wrapper">
          <input 
            id="chatInput" 
            type="text" 
            placeholder="Ask a question about the video..." 
            class="chat-input"
            disabled
          />
          <button id="sendBtn" class="send-btn" disabled>
            <span class="send-icon">➤</span>
          </button>
        </div>
        <div class="chat-actions">
          <button id="clearBtn" class="action-btn" disabled>
            <span>🗑️</span> Clear Chat
          </button>
          <button id="exportBtn" class="action-btn" disabled>
            <span>💾</span> Export
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
